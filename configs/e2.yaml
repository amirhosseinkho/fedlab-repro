# E2: non-IID sensitivity of FedAvg and SCAFFOLD on CIFAR-10.
# alpha = 0.1 and 0.5 are the E1 runs (identical settings); this file adds
# alpha = 1.0 and 100. experiments/aggregate.py joins the two.
seeds: [0, 1, 2]

base:
  dataset: cifar10
  partition: dirichlet
  num_clients: 100
  fraction: 0.1
  rounds: 200
  local_epochs: 2
  batch_size: 50
  lr: 0.1                # winner of the 30-round lr pilot on seed 100 (D19)
  mu: 0.01
  eval_every: 5
  device: cuda

groups:
  - name: cifar10
    grid:
      alpha: [1.0, 100.0]
      algorithm: [fedavg, scaffold]

quick:
  seeds: [0]
  set:
    dataset: mnist
    num_clients: 10
    fraction: 0.5
    rounds: 5
    local_epochs: 1
    batch_size: 32
    lr: 0.1
    eval_every: 1
    max_train: 12000
    max_test: 2000
    device: cpu
