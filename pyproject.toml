[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedlab"
version = "0.1.0"
description = "FedAvg, FedProx and SCAFFOLD under non-IID data on Flower, with sample-level and user-level DP"
authors = [{ name = "Amirhossein Khoshbakht" }]
license = "MIT"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
